<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nhấn Chuỗi Hàng Ngày</title>
  <meta name="description" content="Trang Nhấn Chuỗi Hàng Ngày - 1 lần mỗi ngày">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f172a;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    /* Fallback nếu iframe bị chặn */
    .fallback {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 20px;
    }
    .fallback a {
      color: #a78bfa;
      font-size: 1.2rem;
      text-decoration: none;
      padding: 12px 24px;
      border: 1px solid #a78bfa;
      border-radius: 8px;
      display: inline-block;
      margin-top: 16px;
    }
    .fallback a:hover {
      background: #a78bfa;
      color: #0f172a;
    }
  </style>
</head>
<body>
  <iframe 
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbwpvP0thYvIgD7C6Q7EK45DNqyCIsNYfXV0xigyo6COiYw1-GpKBikvR_C-jOO576P4tg/exec"
    allow="notifications; fullscreen"
    allowfullscreen
    title="Nhấn Chuỗi Hàng Ngày">
  </iframe>

  <div class="fallback" id="fallback">
    <h2>Không thể tải trang trong khung</h2>
    <p>Google Apps Script có thể chặn nhúng iframe.<br>Nhấn nút bên dưới để mở trực tiếp:</p>
    <a href="https://script.google.com/macros/s/AKfycbwpvP0thYvIgD7C6Q7EK45DNqyCIsNYfXV0xigyo6COiYw1-GpKBikvR_C-jOO576P4tg/exec" target="_blank" rel="noopener">
      Mở Nhấn Chuỗi
    </a>
  </div>

  <script>
    // Kiểm tra nếu iframe không load được sau 5 giây
    const iframe = document.getElementById('appFrame');
    const fallback = document.getElementById('fallback');
    
    let loaded = false;
    iframe.onload = function() {
      loaded = true;
      // Thử truy cập contentWindow để kiểm tra (có thể fail do cross-origin)
      try {
        // Nếu cross-origin thì sẽ throw, coi như đã load
      } catch(e) {}
    };

    setTimeout(() => {
      if (!loaded) {
        // Một số trình duyệt vẫn fire onload dù bị chặn, nên fallback chỉ hiện nếu thực sự lỗi
      }
    }, 4000);

    // Yêu cầu quyền thông báo trên trang GitHub (để user bật notification)
    // Lưu ý: Notification permission là theo origin, nên notification từ iframe Google vẫn thuộc origin Google
    if ('Notification' in window && Notification.permission === 'default') {
      // Không tự động request để tránh spam, chỉ khi user tương tác
      // Có thể thêm nút nếu cần
    }

    // Để hỗ trợ notification tốt hơn, một số app cần focus
    window.addEventListener('focus', () => {
      // nothing
    });
  </script>
</body>
</html>
