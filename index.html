<style>
/* ============ Biến màu / giao diện ============ */
:root{
  --bg:#fff6f1; --bg2:#ffe9df; --surface:#ffffff; --surface2:#fff1ea; --text:#201a17; --muted:#74655c; --line:#f0dfd5;
  --red:#e5312b; --red2:#ff6a4d; --red-soft:#fde8e5; --green:#16a34a; --green-soft:#dcf5e5; --amber:#f59e0b;
  --bar:rgba(255,255,255,.82); --shadow:0 8px 28px rgba(110,45,20,.10); --shadow-s:0 2px 10px rgba(110,45,20,.08);
  --radius:20px; --radius-s:14px;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans","Noto Sans CJK SC","Noto Sans CJK JP","Noto Sans CJK KR",sans-serif;
  --m-land:#eef3e6; --m-block:#e3e8d6; --m-park:#b9dfa0; --m-tree:#4fa05a; --m-water:#a9d6f2; --m-road:#ffffff; --m-roadedge:#d7d2c6; --m-line:#e9e4d8;
  --b0:#f4c7a8; --b1:#e8a98f; --b2:#f1dcb0; --b3:#c9d3e6; --b4:#d9c2e3; --b5:#bfe0d6;
  color-scheme:light;
}
[data-theme="dark"]{
  --bg:#130f0d; --bg2:#1b1512; --surface:#1f1a17; --surface2:#2a231f; --text:#f7efe9; --muted:#b4a59b; --line:#3a312b;
  --red:#ff5b52; --red2:#ff7f5f; --red-soft:#3c1f1d; --green:#34d27b; --green-soft:#17382a; --amber:#fbbf24;
  --bar:rgba(24,19,16,.82); --shadow:0 8px 28px rgba(0,0,0,.45); --shadow-s:0 2px 10px rgba(0,0,0,.35);
  --m-land:#1f261d; --m-block:#262e22; --m-park:#2f5d34; --m-tree:#3f8a4b; --m-water:#1f4a63; --m-road:#4a423c; --m-roadedge:#2c2724; --m-line:#6a6058;
  --b0:#8a5a43; --b1:#7a4b3a; --b2:#8b7a4d; --b3:#4d5a74; --b4:#5e4a70; --b5:#3f6a5e;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px;-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:var(--font);line-height:1.45;overflow-x:hidden;
  background-image:radial-gradient(1200px 500px at 85% -10%,var(--bg2),transparent 60%),radial-gradient(900px 420px at -10% 0%,var(--bg2),transparent 55%);
  background-repeat:no-repeat;transition:background-color .3s,color .3s}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
img{max-width:100%}
h1,h2,h3,p{margin:0}
.ico{display:inline-block;vertical-align:middle;flex:none}
.hidden{display:none!important}
.searching .hide-on-search{display:none!important}
.btn.busy{opacity:.6;pointer-events:none}
.btn.busy::before{content:"";width:1em;height:1em;border-radius:50%;border:2.5px solid currentColor;border-top-color:transparent;animation:spinSlow .7s linear infinite}
.wrap{width:100%;max-width:1100px;margin:0 auto;padding:1rem clamp(.75rem,3vw,1.5rem) 2.5rem}
.page{min-height:100vh;display:flex;flex-direction:column;animation:pageIn .38s cubic-bezier(.2,.8,.2,1) both}
.page>.wrap{flex:1 0 auto}
.page.noanim{animation:none}
.page.page-back{animation:pageBack .32s cubic-bezier(.2,.8,.2,1) both}
@keyframes pageIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pageBack{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes riseIn{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
@keyframes wobble{0%,100%{transform:rotate(0)}15%{transform:rotate(-6deg)}30%{transform:rotate(5deg)}45%{transform:rotate(-4deg)}60%{transform:rotate(3deg)}75%{transform:rotate(-1.5deg)}}
@keyframes bounceIn{0%{transform:scale(.3) rotate(-8deg);opacity:0}55%{transform:scale(1.12) rotate(3deg);opacity:1}75%{transform:scale(.96)}100%{transform:scale(1)}}
@keyframes pulseRing{0%{box-shadow:0 0 0 0 rgba(229,49,43,.45)}100%{box-shadow:0 0 0 16px rgba(229,49,43,0)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes spinSlow{to{transform:rotate(360deg)}}
@keyframes checkDraw{from{stroke-dashoffset:40}to{stroke-dashoffset:0}}
@keyframes steam{0%{opacity:0;transform:translateY(4px)}50%{opacity:.9}100%{opacity:0;transform:translateY(-8px)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ============ Thanh trên ============ */
.topbar{position:sticky;top:0;z-index:30;background:var(--bar);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.tb-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:.5rem;padding:.55rem clamp(.6rem,3vw,1.5rem);min-height:3.4rem}
.tb-title{flex:1;min-width:0;font-size:1.12rem;font-weight:800;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-spacer{flex:1}
.icon-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:.25rem;min-width:2.6rem;height:2.6rem;padding:0 .6rem;border-radius:999px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-s);transition:transform .15s,background .2s}
.icon-btn:active{transform:scale(.92)}
.icon-btn .tb-back-t{font-weight:700;font-size:.92rem}
.cart-btn .badge{position:absolute;top:-.25rem;right:-.2rem;min-width:1.25rem;height:1.25rem;padding:0 .3rem;border-radius:999px;background:var(--red);color:#fff;font-size:.72rem;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid var(--surface)}
.badge.pop{animation:pop .4s}
.brand{display:flex;align-items:center;gap:.55rem;min-width:0}
.brand-name{font-size:1.25rem;font-weight:900;letter-spacing:-.02em;white-space:nowrap}
.brand-name b{color:var(--red)}
.install-btn{display:inline-flex;align-items:center;gap:.4rem;height:2.6rem;padding:0 .85rem;border-radius:999px;background:linear-gradient(135deg,var(--red2),var(--red));color:#fff;font-weight:800;font-size:.85rem;box-shadow:0 6px 16px rgba(229,49,43,.32);animation:pulseRing 2.4s infinite}
.install-btn span{white-space:nowrap}
.search-row{max-width:1100px;margin:0 auto;padding:0 clamp(.6rem,3vw,1.5rem) .65rem}
.search{display:flex;align-items:center;gap:.55rem;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:.15rem .5rem .15rem .9rem;box-shadow:var(--shadow-s);transition:border-color .2s,box-shadow .2s}
.search:focus-within{border-color:var(--red);box-shadow:0 0 0 4px var(--red-soft)}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;height:2.5rem;font-size:1rem}
.search input::-webkit-search-cancel-button{display:none}
.search .clear{width:2rem;height:2rem;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--muted);background:var(--surface2)}

/* ============ Nút / thẻ ============ */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-s)}
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:2.8rem;padding:.55rem 1.1rem;border-radius:999px;font-weight:800;border:1.5px solid var(--line);background:var(--surface);transition:transform .15s,box-shadow .2s,filter .2s;text-align:center}
.btn:active{transform:scale(.96)}
.btn-primary{background:linear-gradient(135deg,var(--red2),var(--red));color:#fff;border-color:transparent;box-shadow:0 8px 20px rgba(229,49,43,.28)}
.btn-outline{background:transparent;border-color:var(--red);color:var(--red)}
.btn-ghost{background:var(--surface2)}
.btn-lg{min-height:3.2rem;font-size:1.05rem;padding:.7rem 1.4rem}
.btn[disabled]{opacity:.55;pointer-events:none}
.btn::after{content:"";position:absolute;inset:0;background:radial-gradient(circle,rgba(255,255,255,.45) 0,transparent 60%);opacity:0;transform:scale(.4);transition:opacity .4s,transform .4s}
.btn:active::after{opacity:1;transform:scale(2.4);transition:0s}
.btn-row{display:flex;flex-wrap:wrap;gap:.6rem}
.btn-row>.btn{flex:1 1 9rem}
.sec-title{font-size:1.1rem;font-weight:900;margin:1.6rem 0 .8rem;display:flex;align-items:center;gap:.5rem;letter-spacing:-.01em}
.sec-title.big{font-size:clamp(1.5rem,5.5vw,2.1rem);letter-spacing:-.02em}
.sec-title .more{margin-left:auto;display:inline-flex;align-items:center;gap:.15rem;color:var(--red);font-size:.95rem;font-weight:800}
.muted{color:var(--muted)}
.red{color:var(--red)}
.chip{display:inline-flex;align-items:center;gap:.35rem;padding:.25rem .65rem;border-radius:999px;font-size:.8rem;font-weight:800;background:var(--red-soft);color:var(--red)}
.chip.green{background:var(--green-soft);color:var(--green)}
.chip.gray{background:var(--surface2);color:var(--muted)}
.rating{display:inline-flex;align-items:center;gap:.25rem;font-weight:800;font-size:.9rem}
.rating .star{color:#f5a524;fill:#f5a524}
.price{font-weight:900;color:var(--red);letter-spacing:-.01em}

/* ============ Hero ============ */
.hero{position:relative;overflow:hidden;padding:clamp(1.1rem,4vw,2rem);margin-top:.4rem;background:linear-gradient(135deg,var(--surface),var(--surface2))}
.hero::before{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(229,49,43,.16),transparent 70%)}
.hero h1{position:relative;font-size:clamp(1.45rem,6vw,2.4rem);line-height:1.18;font-weight:900;letter-spacing:-.02em}
.hero h1 em{font-style:normal;color:var(--red)}
.hero p{position:relative;margin-top:.8rem;color:var(--muted);font-size:1rem}
.hero p b{color:var(--text)}
.hero-emoji{position:absolute;right:1rem;bottom:.4rem;font-size:3.2rem;opacity:.9;animation:floaty 3.2s ease-in-out infinite;pointer-events:none}

/* ============ Lượt xem (trắng đen) ============ */
.views{display:inline-flex;align-items:center;gap:.6rem;margin-top:.9rem;padding:.55rem 1rem .55rem .75rem;border-radius:999px;background:#0b0b0b;color:#fff;border:1.5px solid #0b0b0b;box-shadow:0 6px 18px rgba(0,0,0,.22);font-weight:700}
[data-theme="dark"] .views{background:#fff;color:#0b0b0b;border-color:#fff;box-shadow:0 6px 18px rgba(255,255,255,.12)}
.views .v-ico{display:flex;width:2rem;height:2rem;border-radius:50%;align-items:center;justify-content:center;background:#fff;color:#0b0b0b}
[data-theme="dark"] .views .v-ico{background:#0b0b0b;color:#fff}
.views .v-label{font-size:.85rem;opacity:.85}
.views b{font-size:1.25rem;font-variant-numeric:tabular-nums;letter-spacing:.01em;min-width:1.5ch}
.views .dot{width:.5rem;height:.5rem;border-radius:50%;background:#22c55e;box-shadow:0 0 0 0 rgba(34,197,94,.6);animation:pulseDot 2s infinite}
.views.off .dot{background:#9ca3af;animation:none}
@keyframes pulseDot{0%{box-shadow:0 0 0 0 rgba(34,197,94,.55)}100%{box-shadow:0 0 0 9px rgba(34,197,94,0)}}
.views b.bump{animation:pop .45s}

/* ============ Accordion công cụ ============ */
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,17rem),1fr));gap:.7rem;margin-top:1rem;align-items:start}
.acc{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-s);box-shadow:var(--shadow-s);overflow:hidden;transition:border-color .2s,box-shadow .2s}
.acc.open{border-color:var(--red);box-shadow:0 8px 22px rgba(229,49,43,.12)}
.acc-head{width:100%;display:flex;align-items:center;gap:.65rem;padding:.8rem .95rem;font-weight:800;text-align:left}
.acc-head>span{flex:1;min-width:0}
.acc-head .ico:first-child{color:var(--red)}
.acc .chev{transition:transform .3s;color:var(--muted)}
.acc.open>.acc-head .chev{transform:rotate(180deg)}
.acc-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .32s ease}
.acc.open>.acc-body{grid-template-rows:1fr}
.acc-in{overflow:hidden;min-height:0}
.acc-pad{padding:0 .95rem .95rem}
.acc-sub{font-size:.8rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:.2rem 0 .45rem}
.opts{display:flex;flex-direction:column;gap:.4rem}
.opt{display:flex;align-items:center;gap:.6rem;width:100%;padding:.62rem .8rem;border-radius:12px;background:var(--surface2);border:1.5px solid transparent;text-align:left;font-weight:600;transition:background .2s,border-color .2s,color .2s,transform .12s}
.opt:active{transform:scale(.98)}
.opt .opt-t{flex:1;min-width:0}
.opt .opt-p{font-weight:700;color:var(--muted);font-size:.88rem;white-space:nowrap}
.opt .tick{color:var(--red)}
.opt.sel{color:var(--red);background:var(--red-soft);border-color:var(--red);font-weight:800}
.opt.sel .opt-p{color:var(--red)}
.opt .flag{font-size:1.25rem;line-height:1}
.opts.row{flex-direction:row;flex-wrap:wrap}
.opts.row .opt{width:auto;flex:1 1 7rem}
.size-ctl{display:flex;align-items:center;gap:.5rem;margin-top:.5rem}
.size-ctl .btn{min-height:2.6rem;flex:1}
.size-ctl .mid{flex:1.4}
.size-ctl .btn.sel{border-color:var(--red);color:var(--red)}
.fsmall{font-size:.85em}
.share-sub{display:flex;flex-direction:column;gap:.5rem}

/* ============ Danh mục ============ */
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem;margin-top:1rem}
.cat{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3rem;padding:1rem .4rem;border-radius:var(--radius);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-s);font-weight:800;text-align:center;font-size:.92rem;transition:transform .2s,box-shadow .2s}
.cat:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.cat:active{transform:scale(.95)}
.cat .emo{font-size:2.2rem;line-height:1;transition:transform .3s}
.cat:hover .emo{transform:scale(1.15) rotate(-6deg)}
.cat .badge{position:absolute;top:.4rem;right:.5rem;min-width:1.3rem;height:1.3rem;padding:0 .35rem;border-radius:999px;background:var(--red);color:#fff;font-size:.72rem;display:flex;align-items:center;justify-content:center}
.rand-btn{width:100%;margin-top:1rem;position:relative;overflow:hidden}
.rand-btn .ico{animation:wobble 2.4s infinite}

/* ============ Lưới món ăn ============ */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.75rem}
@media (min-width:620px){.grid{grid-template-columns:repeat(auto-fill,minmax(12.5rem,1fr));gap:1rem}}
.dish{cursor:pointer;overflow:hidden;display:flex;flex-direction:column;animation:riseIn .5s both;animation-delay:calc(var(--i,0)*45ms);transition:transform .22s,box-shadow .22s}
.dish:hover{transform:translateY(-5px);box-shadow:var(--shadow)}
.dish:active{transform:scale(.97)}
.dish-body{padding:.65rem .75rem .8rem;display:flex;flex-direction:column;gap:.35rem;flex:1}
.dish-name{font-size:.98rem;font-weight:800;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.45em}
.dish-meta{display:flex;align-items:center;justify-content:space-between;gap:.4rem;flex-wrap:wrap;margin-top:auto}
.dish-meta .price{font-size:1rem}
.img-wrap{position:relative;overflow:hidden;aspect-ratio:4/3;background:linear-gradient(90deg,var(--surface2) 25%,var(--bg2) 50%,var(--surface2) 75%);background-size:200% 100%;animation:shimmer 1.6s linear infinite}
.img-wrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .45s,transform .6s;transform:scale(var(--zs,1));transform-origin:var(--zo,50% 50%)}
.img-wrap img.ok{opacity:1}
.img-wrap .img-ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:2.4rem;opacity:.5}
.img-wrap.fail{animation:none;background:linear-gradient(135deg,var(--red-soft),var(--surface2))}
.img-wrap.fail .img-ph{opacity:1}
.img-wrap.fail img{display:none}
.dish:hover .img-wrap img.ok{--zs:1.06}
.empty{padding:2.4rem 1rem;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:.7rem}
.empty .e-ico{font-size:3rem;animation:floaty 3s ease-in-out infinite}

/* ============ Xem gần đây ============ */
.rlist{display:flex;flex-direction:column;gap:.55rem}
.ritem{display:flex;align-items:center;gap:.75rem;padding:.55rem;border-radius:var(--radius-s);background:var(--surface);border:1px solid var(--line);cursor:pointer;transition:transform .15s,box-shadow .2s;animation:riseIn .45s both;animation-delay:calc(var(--i,0)*40ms)}
.ritem:hover{box-shadow:var(--shadow)}
.ritem:active{transform:scale(.98)}
.ritem .img-wrap{width:4.2rem;height:4.2rem;aspect-ratio:1;border-radius:12px;flex:none}
.ritem .r-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:.15rem}
.ritem .r-name{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ritem .r-sub{font-size:.82rem;color:var(--muted);display:flex;align-items:center;gap:.3rem;flex-wrap:wrap}
@media (min-width:760px){.rlist.cols{display:grid;grid-template-columns:1fr 1fr}}

/* ============ Chi tiết món ============ */
.dish-grid{display:grid;gap:1.2rem}
@media (min-width:820px){.dish-grid{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:start}.gallery{position:sticky;top:5rem}}
.gallery .g-main .img-wrap{border-radius:var(--radius);aspect-ratio:4/3.2;box-shadow:var(--shadow)}
.g-thumbs{display:flex;gap:.55rem;margin-top:.6rem}
.thumb{flex:1;max-width:7rem;border-radius:12px;overflow:hidden;border:2.5px solid transparent;transition:border-color .2s,transform .15s}
.thumb .img-wrap{aspect-ratio:1;animation:none}
.thumb.sel{border-color:var(--red);transform:translateY(-2px)}
.info h2{font-size:clamp(1.4rem,5vw,2rem);font-weight:900;line-height:1.2;letter-spacing:-.02em}
.info .meta{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;margin:.5rem 0}
.info .big-price{font-size:1.7rem}
.desc-link{display:flex;align-items:center;gap:.6rem;width:100%;margin:.8rem 0;padding:.8rem .9rem;border-radius:var(--radius-s);background:var(--surface);border:1px solid var(--line);font-weight:800;text-align:left;transition:box-shadow .2s}
.desc-link:hover{box-shadow:var(--shadow-s)}
.desc-link>span{flex:1}
.desc-link .ico:first-child{color:var(--red)}
.opt-group{margin-top:1.1rem}
.opt-group h3{font-size:1rem;font-weight:900;margin-bottom:.5rem}
.opt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,11rem),1fr));gap:.45rem}

const imgMem = {}, imgFlight = {}, imgDone = {};
function imgTag(d, cls) {
  return '<img data-src="' + esc(d.img) + '" alt="' + esc(dishName(d)) + '" decoding="async" draggable="false"' + (cls ? ' class="' + cls + '"' : "") + '><span class="img-ph" aria-hidden="true">🍜</span>';

function cacheImage(url) {
  if (imgMem[url] || imgFlight[url] || navigator.onLine === false || typeof fetch !== "function") return;
  imgFlight[url] = 1;
  fetch(url, { mode: "cors" }).then(function (r) { if (!r.ok) throw new Error("x"); return r.blob(); }).then(function (b) {
    if (!/^image\//.test(b.type)) throw new Error("t");
    idb.set("img", url, b);
    imgMem[url] = URL.createObjectURL(b);
  }).catch(function () { }).then(function () { delete imgFlight[url]; });
}
function hydrateImages(root) {
  $$("img[data-src]", root).forEach(function (img) {
    var url = img.getAttribute("data-src"), mem = imgMem[url], triedUrl = false;
    img.removeAttribute("data-src");
    var ok = function () { img.classList.add("ok"); imgDone[url] = 1; var w = img.parentNode; if (w) w.style.animation = "none"; };
    img.addEventListener("load", ok);
    img.addEventListener("error", function () {
      if (mem && !triedUrl && navigator.onLine !== false) { triedUrl = true; img.src = url; return; }
      if (img.parentNode) img.parentNode.classList.add("fail");
    });
    if (imgDone[url]) { img.style.transition = "none"; img.classList.add("ok"); }
    img.src = mem || url;
    if (!mem) cacheImage(url);
    if (img.complete && img.naturalWidth) ok();
  });
}
function imgBlobFor(url) {
  /* Trả về Promise<Blob|null> dùng khi vẽ ảnh chia sẻ */
  if (imgMem[url]) return fetch(imgMem[url]).then(function (r) { return r.blob(); }).catch(function () { return null; });
  return idb.get("img", url).then(function (b) {
    if (b && b.size) return b;
    if (navigator.onLine === false) return null;
    return fetch(url, { mode: "cors" }).then(function (r) { return r.ok ? r.blob() : null; }).catch(function () { return null; });
  });
}

function copyText(text) {
  var fallback = function () {
    try {
      var ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly", ""); ta.style.cssText = "position:fixed;left:-9999px;top:0;opacity:0";
      document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
      var ok = document.execCommand("copy"); document.body.removeChild(ta); return ok;
    } catch (e) { return false; }
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text).then(function () { return true; }, function () { return fallback(); });
  }
  return Promise.resolve(fallback());
}
