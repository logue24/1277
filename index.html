<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nhấn Chuỗi Hàng Ngày</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="header">
        <i class="fa-solid fa-link icon-main"></i>
        <h1>Nhấn Chuỗi</h1>
        <p class="subtitle">Mỗi ngày chỉ được nhấn 1 lần</p>
      </div>

      <div class="stats">
        <div class="stat-item">
          <i class="fa-solid fa-fire"></i>
          <div>
            <span class="label">Tổng lần nhấn</span>
            <span id="totalClicks" class="value">0</span>
          </div>
        </div>
      </div>

      <div class="countdown-box">
        <div class="countdown-label">Thời gian còn lại</div>
        <div id="countdown" class="countdown">--:--:--</div>
      </div>

      <button id="btnChuoi" class="btn-chuoi" disabled>
        <i class="fa-solid fa-hand-pointer"></i>
        <span id="btnText">Đang tải...</span>
      </button>

      <div id="message" class="message"></div>
    </div>

    <footer>
      <p>Tự động cập nhật • Không cần tải lại trang</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
